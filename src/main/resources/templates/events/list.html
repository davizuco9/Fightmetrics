<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Eventos | FightMetrics</title>
</head>

<body>

<main>

    <h1>Eventos</h1>

    <div sec:authorize="hasRole('ADMIN')">

        <a th:href="@{/events/new}">
            Crear evento
        </a>

    </div>

    <form
            th:action="@{/events}"
            method="get"
    >

        <div>

            <label for="search">
                Buscar evento
            </label>

            <input
                    id="search"
                    name="search"
                    type="text"
                    th:value="${search}"
                    placeholder="Nombre del evento"
            >

        </div>

        <div>

            <label for="status">
                Estado
            </label>

            <select
                    id="status"
                    name="status"
            >

                <option value="">
                    Todos los estados
                </option>

                <option
                        th:each="eventStatus : ${eventStatuses}"
                        th:value="${eventStatus}"
                        th:text="${eventStatus}"
                        th:selected="${eventStatus == selectedStatus}"
                >
                </option>

            </select>

        </div>

        <button type="submit">
            Buscar
        </button>

        <a th:href="@{/events}">
            Limpiar filtros
        </a>

    </form>

    <p th:if="${#lists.isEmpty(events)}">
        No se encontraron eventos.
    </p>

    <table th:unless="${#lists.isEmpty(events)}">

        <thead>

        <tr>
            <th>Nombre</th>
            <th>Organización</th>
            <th>Fecha</th>
            <th>Ciudad</th>
            <th>País</th>
            <th>Estado</th>
            <th>Detalle</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="event : ${events}">

            <td th:text="${event.name}">
                Evento
            </td>

            <td th:text="${event.organization}">
                UFC
            </td>

            <td th:text="${event.eventDate}">
                2026-06-28
            </td>

            <td th:text="${event.city}">
                Ciudad
            </td>

            <td th:text="${event.country}">
                País
            </td>

            <td th:text="${event.status}">
                SCHEDULED
            </td>

            <td>

                <a
                        th:href="@{/events/{id}(id=${event.id})}"
                >
                    Ver evento
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <p>
        <a th:href="@{/}">
            Volver al inicio
        </a>
    </p>

</main>

</body>

</html>
