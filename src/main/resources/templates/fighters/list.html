<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Luchadores | FightMetrics</title>
</head>

<body>

<main>

    <h1>Luchadores</h1>

    <div sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/fighters/new}">
            Añadir luchador
        </a>
    </div>

    <form
            th:action="@{/fighters}"
            method="get"
    >

        <div>
            <label for="search">Buscar</label>

            <input
                    id="search"
                    name="search"
                    type="text"
                    th:value="${search}"
                    placeholder="Nombre, apellido o apodo"
            >
        </div>

        <div>
            <label for="weightClass">Categoría</label>

            <select
                    id="weightClass"
                    name="weightClass"
            >
                <option value="">
                    Todas las categorías
                </option>

                <option
                        th:each="weightClass : ${weightClasses}"
                        th:value="${weightClass}"
                        th:text="${weightClass}"
                        th:selected="${weightClass == selectedWeightClass}"
                >
                </option>
            </select>
        </div>

        <button type="submit">
            Buscar
        </button>

        <a th:href="@{/fighters}">
            Limpiar filtros
        </a>

    </form>

    <p th:if="${#lists.isEmpty(fighters)}">
        No se encontraron luchadores.
    </p>

    <table th:unless="${#lists.isEmpty(fighters)}">

        <thead>

        <tr>
            <th>Nombre</th>
            <th>Apodo</th>
            <th>Nacionalidad</th>
            <th>Categoría</th>
            <th>Récord registrado</th>
            <th>Estado</th>
            <th>Perfil</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="fighter : ${fighters}">

            <td
                    th:text="${fighter.firstName + ' ' + fighter.lastName}"
            >
                Nombre
            </td>

            <td
                    th:text="${fighter.nickname != null
                    and !fighter.nickname.isBlank()
                    ? fighter.nickname
                    : '-'}"
            >
                -
            </td>

            <td th:text="${fighter.nationality}">
                País
            </td>

            <td th:text="${fighter.weightClass}">
                Categoría
            </td>

            <td
                    th:text="${fighter.wins
                    + '-'
                    + fighter.losses
                    + '-'
                    + fighter.draws}"
            >
                0-0-0
            </td>

            <td th:text="${fighter.active ? 'Activo' : 'Inactivo'}">
                Activo
            </td>

            <td>
                <a
                        th:href="@{/fighters/{id}(id=${fighter.id})}"
                >
                    Ver perfil
                </a>
            </td>

        </tr>

        </tbody>

    </table>

    <p>
        <a th:href="@{/}">
            Volver al inicio
        </a>
    </p>

</main>

</body>

</html>
