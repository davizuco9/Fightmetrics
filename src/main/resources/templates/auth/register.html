<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | FightMetrics</title>
</head>
<body>

<main>
    <h1>Crear cuenta</h1>

    <p th:if="${registerError}" th:text="${registerError}">
        Error al registrar el usuario.
    </p>

    <form
            th:action="@{/register}"
            th:object="${user}"
            method="post"
    >

        <div>
            <label for="username">Nombre de usuario</label>
            <input
                    id="username"
                    type="text"
                    th:field="*{username}"
                    required
            >
            <p
                    th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}">
            </p>
        </div>

        <div>
            <label for="email">Correo electrónico</label>
            <input
                    id="email"
                    type="email"
                    th:field="*{email}"
                    required
            >
            <p
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}">
            </p>
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input
                    id="password"
                    type="password"
                    th:field="*{password}"
                    required
            >
            <p
                    th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}">
            </p>
        </div>

        <button type="submit">
            Crear cuenta
        </button>
    </form>

    <p>
        ¿Ya tienes cuenta?
        <a th:href="@{/login}">
            Inicia sesión
        </a>
    </p>

    <p>
        <a th:href="@{/}">
            Volver al inicio
        </a>
    </p>
</main>

</body>
</html>
